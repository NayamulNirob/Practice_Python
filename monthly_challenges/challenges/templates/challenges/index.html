<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Monthly Challenges</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="bg-primary text-white text-center py-4">
        <div class="container">
            <h1 class="display-4 mb-2">Welcome to the Challenges App</h1>
            <p class="lead mb-0">Here you can find monthly challenges to improve your skills and habits.</p>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center text-center">
        <div>
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="text-center text-muted py-3 small">
        Keep going, one month at a time.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
