{% extends "blog/base.html" %}
{% block content %}
    <h2>You have been Log Out</h2>
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
    </form>
    <div class="border-top pt-3">
        <small class="text-muted">
            <a href="{% url 'login' %}" class="ml-2">Login again</a>
        </small>
    </div>
{% endblock content %}
