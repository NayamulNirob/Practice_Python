{% extends "blog/base.html" %}
{% block content %}
    <article class="media content-section">
        <img class="rounded-circle article-img" src="{{ object.author.profile.image.url }}">
        <div class="media-body">
            <div class="article-metadata ">
                <a class="mr-2" href="#">{{ object.author }}</a>
                <small class="text-muted">{{ object.date_posted|date:"F d, Y" }}</small>
                {% if object.author == user %}
                    <div class = "float-right mt-1 mb-1">
                        <button type="button" class="btn btn-primary btn-sm me-md-2"
                                href="{% url 'post-update' object.id %}">Update
                        </button>
                        <button type="button" class="btn btn-danger btn-sm me-md-2"
                                href="{% url 'post-delete' object.id %}">Delete
                        </button>
                    </div>
                {% endif %}
            </div>
            <h2 class="article-title">{{ object.title }}</h2>
            <p class="article-content">{{ object.content }}</p>
        </div>
    </article>
{% endblock content %}
